excluded:
  - whisper.cpp
  - build
  - DerivedData
  - WhisperType.xcodeproj

disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - trailing_comma
  - redundant_string_enum_value
  - unneeded_override
  - closure_parameter_position

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
